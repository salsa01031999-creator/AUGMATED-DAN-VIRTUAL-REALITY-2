<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Caca</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #arjs-video,
        a-scene canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <img id="foto-tekstur" src="asset/tekstur.jpeg">
        </a-assets>
        
        <!-- PENGCAHAYAAN -->
        <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light id="dir-light" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

        <!-- MARKER HIRO -->
        <a-marker preset="hiro">
            
            <!-- Alas Bidang Datar -->
            <a-plane id="alas-bidang" position="0 0 0" rotation="-90 0 0" width="2" height="2" color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

            <!-- KELOMPOK OBJEK UTAMA -->
            <a-entity id="kelompok-objek-utama" position="0 0 0">
                <!-- Kubus Biru -->
                <a-box id="kubus-biru" position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5" color="#406BF5"></a-box>

                <!-- Bola Oranye -->
                <a-sphere id="bola-oranye" position="0 0.3 0" radius="0.3" color="#D9531E" metalness="0.1" roughness="0.4"></a-sphere>

                <!-- Silinder Animasi -->
                <a-cylinder id="silinder-animasi" position="0.6 0.3 0" radius="0.2" height="0.6" color="#087F73" 
                            animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
                </a-cylinder>
            </a-entity>

            <!-- Kotak Bertekstur -->
            <a-box id="kotak-tekstur" position="0 0.15 0.7" width="0.5" height="0.3" depth="0.5" material="src: #foto-tekstur"></a-box>
            <a-plane id="foto-di-atas-kotak" position="0 0.302 0.7" rotation="-90 0 0" width="0.225" height="0.5" material="src: #foto-tekstur; shader: flat; side: double"></a-plane>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
